<svg xmlns="http://www.w3.org/2000/svg" width="3072" height="1792" viewBox="0 0 96 56">
  <!-- The front of the Business card (96 × 56 mm with 3 mm bleed), for the README's screenshots.
       Made-up studio and person. -->
  <rect width="96" height="56" fill="#f6f1e7"/>
  <g transform="translate(15 17)" fill="none" stroke="#ec6a3c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-6,3 0,-4 6,3"/>
    <line x1="0" y1="-4" x2="-2.5" y2="9"/>
  </g>
  <text x="28" y="19" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="4.4" letter-spacing="1.3" fill="#2b2b2b">KESTREL STUDIO</text>
  <text x="10" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="5" fill="#2b2b2b">Ada Novak</text>
  <text x="10" y="43" font-family="Arial, Helvetica, sans-serif" font-size="2.6" fill="#7a7468">Brand designer</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="2.4" fill="#7a7468" text-anchor="end">
    <text x="86" y="40">ada@kestrel.example</text>
    <text x="86" y="44">+00 123 456 789</text>
  </g>
</svg>
