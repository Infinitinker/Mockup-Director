name: Build macOS app

# Builds the macOS release file: a .dmg with a universal app (Apple Silicon and Intel), kept on the
# run's page under its release file name, and checks it. The Release workflow (release.yml) calls it
# and drafts the release from it; run on its own, it shows early that a change still builds.
#
# It runs for every pull request (also Dependabot's and those from forks), from the Release workflow,
# and on demand (Actions > Build macOS app > Run workflow, on any branch); never for pushes.
# It is not a required status check; the Checks (checks.yml) and E2E tests (e2e.yml) are.
#
# Signing and notarization are optional. Without secrets the app is ad-hoc signed
# (bundle.macOS.signingIdentity "-" in tauri.conf.json), and users allow it once in System Settings →
# Privacy & Security (see the README). To sign, add these repository secrets (docs/releasing.md):
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  the password of the .p12
#   APPLE_SIGNING_IDENTITY      for example "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID: for notarization
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request cancels the build still going; a release's build is never cut short.
# Called from release.yml, github.workflow is "Release".
concurrency:
  group: build-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

jobs:
  build:
    name: macOS build (universal)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      # The file, so the check downloads exactly this, whatever else the run builds.
      artifacts: ${{ steps.dmg.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node

      # Both macOS targets, for the universal binary.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install
        run: npm ci
      # The Tauri bundler takes an APPLE_* variable that is defined but empty as set, and would try
      # (and fail) to import an empty certificate or to notarize with an empty Apple ID. So only the
      # secrets that exist are exported; without them the app is ad-hoc signed and not notarized.
      - name: Export the signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          exported=""
          # Signing needs the certificate, its password and the identity together.
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY"
            # Notarization needs a real signature and all three Apple ID values.
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              names="$names APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
            fi
            for name in $names; do
              delim="EOF_$(uuidgen)"
              { echo "$name<<$delim"; printenv "$name"; echo "$delim"; } >> "$GITHUB_ENV"
              exported="$exported $name"
            done
          fi
          if [ -n "$exported" ]; then
            echo "Signing with:$exported"
          else
            echo "No signing secrets: the app is ad-hoc signed."
          fi
      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target universal-apple-darwin

      # The licenses come with every copy (bundle.resources in tauri.conf.json).
      - name: Check the app
        run: |
          resources="$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)/Contents/Resources"
          for file in LICENSE.txt THIRD-PARTY-NOTICES.txt; do
            if [ ! -f "$resources/$file" ]; then
              ls -la "$resources"
              echo "::error::$resources does not contain $file"
              exit 1
            fi
          done
      - name: Name the release file
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist-release/MockupDirector-$version-macos-universal.dmg"
          ls -la dist-release
      # On its own and unzipped, so the run's page offers the file itself.
      - id: dmg
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*-macos-universal.dmg
          archive: false
          if-no-files-found: error

  files:
    name: macOS release files
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # What the check runs, and the action.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            tools/release.mjs
            .github/actions/release-files
            .github/actions/node
          sparse-checkout-cone-mode: false
      - name: Release files
        uses: ./.github/actions/release-files
        with:
          system: macos
          artifacts: ${{ needs.build.outputs.artifacts }}
