# Builds the Mockup Director macOS app (universal binary: Apple Silicon + Intel) as a .dmg, kept on
# the run's page (Actions → run → Artifacts) under its release file name. The release workflow
# (release.yml) calls this workflow and puts the file on the release.
#
# Code signing / notarisation is optional. Without secrets the app is ad-hoc signed
# (tauri.conf.json → bundle.macOS.signingIdentity "-") and must be allowed once in
# System Settings → Privacy & Security (see README). To sign, add these repository secrets:
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  password of the .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID   → notarisation
name: Build macOS app

# Runs on every push to dev and main (a merged pull request is a push to main), on demand, from the
# release workflow, and for pull requests, except those from this repository's dev and main, whose
# pushes are built already (so Dependabot's pull requests and other branches get a build).
# It is not a required status check: the Checks workflow (checks.yml) is.
# Note: in a PRIVATE repository macOS runner minutes count ≈10× Linux minutes against the
# free Actions quota; in a public repository standard runners are free.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push cancels the build still going for the older one; a release's build is never cut short.
# (Called from release.yml, github.workflow is "Release".)
concurrency:
  group: build-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

jobs:
  build-macos:
    # A fork can have a branch named dev too, so forks are always built. Called from release.yml,
    # it always builds, also for a pull request from dev.
    if: >-
      github.event_name != 'pull_request' || github.workflow == 'Release' ||
      github.event.pull_request.head.repo.fork || (github.head_ref != 'dev' && github.head_ref != 'main')
    name: Build (universal-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (both macOS targets for the universal binary)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # The Tauri bundler treats a DEFINED-but-empty APPLE_* variable as "configured" and would
      # try (and fail) to import an empty certificate or notarise with an empty Apple ID.
      # So we export only the secrets that actually exist; missing ones stay undefined and the
      # build falls back to an ad-hoc signed, non-notarised app.
      - name: Export optional signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          exported=""
          # Signing needs certificate + password + identity together.
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY"
            # Notarisation needs a real signature plus all three Apple ID values.
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              names="$names APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
            fi
            for name in $names; do
              delim="EOF_$(uuidgen)"
              { echo "$name<<$delim"; printenv "$name"; echo "$delim"; } >> "$GITHUB_ENV"
              exported="$exported $name"
            done
          fi
          if [ -n "$exported" ]; then
            echo "Signing configured:$exported"
          else
            echo "No signing secrets – building an ad-hoc signed (unsigned) app."
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target universal-apple-darwin

      - name: Name the release file
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist-release/MockupDirector-$version-macos-universal.dmg"
          ls -la dist-release

      # On its own and unzipped, so the run's page offers the file itself.
      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*-macos-universal.dmg
          archive: false
          if-no-files-found: error
