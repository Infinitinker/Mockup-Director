name: Checks

# Pushes to the two long-lived branches, and pull requests, also from forks. The jobs finish in a few
# minutes and have short, fixed names, so they are required status checks of the main branch ruleset
# (docs/releasing.md), with the jobs of e2e.yml. The desktop apps are built by build-windows.yml,
# build-macos.yml and build-linux.yml.
on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Biome (format and lint of TypeScript, the tool scripts, CSS and every JSON file, so also the Tauri
  # configuration) and rustfmt. The results are the same on every system, so it runs once, on the
  # fastest runner.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node
      - name: Install
        run: npm ci
      # Fails on a file Biome would format differently and on any lint warning (npm run lint).
      - name: Lint
        run: npx biome ci --error-on-warnings --reporter=github
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  # The web UI: the TypeScript type-check and the Vite build, and the unit tests (Vitest, tests/). It
  # runs in Node.js, the same on every system.
  web:
    name: Web
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

  # No copyleft (GPL, AGPL, LGPL…) dependency in npm or Rust, and THIRD-PARTY-NOTICES.md (the license
  # texts of the app's dependencies) up to date with them: the same checks as a release.
  licenses:
    name: Licenses
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node
      - name: Install
        run: npm ci
      - name: Licenses and notices
        uses: ./.github/actions/notices

  # The end-to-end test plugins are behind the Cargo feature e2e and the web bridge behind Vite's e2e
  # mode (docs/development.md): proves that the builds a release makes contain neither, and that each
  # check can see them when they are on.
  release-safety:
    name: Release safety
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: npm ci
      - name: Build the web UI
        run: npm run build
      - name: No test code in the release builds
        run: node tools/release-safety.mjs

  # Clippy and the Rust tests. The shell has code for each system (#[cfg(target_os)], #[cfg(unix)]),
  # and clippy and the tests only see the code of the system they run on, so they run on each: on
  # Windows with MSYS2 and Rust's GNU toolchain, the one the app is built with.
  system:
    name: ${{ matrix.name }} Rust checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-26.04
          - name: macOS
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node
      - name: Linux libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-libraries
      - name: Windows toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-toolchain
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install
        run: npm ci
      # The shell embeds the web UI from dist/ when it is compiled, so the UI is built first.
      - name: Build the web UI
        run: npm run build
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
