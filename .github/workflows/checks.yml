name: Checks

# Pushes to the two long-lived branches, and pull requests, also from forks. The jobs finish in a few
# minutes and have short, fixed names, so they are the required status checks of the main branch
# ruleset (docs/development.md). The desktop apps are built by build-windows.yml, build-macos.yml and
# build-linux.yml.
on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Biome (format and lint of TypeScript, the tool scripts, CSS and every JSON file, so also the Tauri
  # configuration), rustfmt, and the same version in package.json and Cargo.toml. The results are the
  # same on every system, so it runs once, on the fastest runner.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Fails on a file Biome would format differently and on any lint warning (npm run lint).
      - name: Lint
        run: npx biome ci --error-on-warnings --reporter=github
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # package.json and src-tauri/Cargo.toml have the same version (tools/release.mjs).
      - name: Version
        run: node tools/release.mjs check

  # The web UI: the TypeScript type-check and the Vite build, the unit tests (Vitest, tests/), and a
  # translation of every text in every interface language. It runs in Node.js, the same on every system.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Translations
        run: npm run check:i18n

  # No copyleft (GPL, AGPL, LGPL…) dependency in npm or Rust, and THIRD-PARTY-NOTICES.md (the license
  # texts of the app's dependencies) up to date with them: the same checks as a release.
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Licenses and notices
        uses: ./.github/actions/notices

  # Clippy and the Rust tests. The shell has code for each system (#[cfg(target_os)]), and clippy only
  # sees the code of the system it runs on, so they run on each: on Windows with MSYS2 and Rust's GNU
  # toolchain, the one the app is built with. The macOS code is compiled by the macOS build
  # (build-macos.yml) on every push.
  system:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The Tauri v2 prerequisites for Debian and Ubuntu (see build-linux.yml).
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      # The same MSYS2 and GNU toolchain as build-windows.yml, where the reasons are explained.
      - id: msys2
        uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put MINGW64 on the PATH
        if: runner.os == 'Windows'
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"
      - name: Install the GNU toolchain
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Linux'
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install
        run: npm ci
      # The shell embeds the web UI from dist/ when it is compiled, so the UI is built first.
      - name: Build the web UI
        run: npm run build
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
