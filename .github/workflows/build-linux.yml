# Builds the Mockup Director Linux app (x86_64): the AppImage, the .deb and the .rpm package, each
# kept on the run's page (Actions → run → Artifacts) under its release file name. The release
# workflow (release.yml) calls this workflow and puts the files on the release.
#
# Linux-specific bundle settings live in src-tauri/tauri.linux.conf.json (merged automatically by
# Tauri on Linux): AppImage + .deb + .rpm.
#   - AppImage: one file for any distribution; it carries its own GTK / WebKitGTK libraries.
#   - .deb (Debian, Ubuntu, Mint …) and .rpm (Fedora, openSUSE …): use the system's WebKitGTK 4.1,
#     declared as package dependencies, so the package manager installs it.
#
# The build runs in an ubuntu:22.04 CONTAINER: a Linux binary only runs on systems with the same or
# a newer glibc than the one it was built against, so the container (glibc 2.35), not the runner
# image, sets the oldest supported system: Ubuntu 22.04+, Debian 12+, Fedora 36+ and similar.
# The hosted ubuntu-22.04 runner image itself is deprecated (removed on 2027-04-17), hence the
# container on a current ubuntu-24.04 host. Raise the container image only when dropping old distros
# (and update the glibc / distro list in README.md and docs/releasing.md).
name: Build Linux app

# Runs on every push to dev and main (a merged pull request is a push to main), on demand, from the
# release workflow, and for pull requests, except those from this repository's dev and main, whose
# pushes are built already (so Dependabot's pull requests and other branches get a build).
# It is not a required status check: the Checks workflow (checks.yml) is.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push cancels the build still going for the older one; a release's build is never cut short.
# (Called from release.yml, github.workflow is "Release".)
concurrency:
  group: build-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

jobs:
  build-linux:
    # A fork can have a branch named dev too, so forks are always built. Called from release.yml,
    # it always builds, also for a pull request from dev.
    if: >-
      github.event_name != 'pull_request' || github.workflow == 'Release' ||
      github.event.pull_request.head.repo.fork || (github.head_ref != 'dev' && github.head_ref != 'main')
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive # tzdata (pulled in by WebKitGTK) must not prompt for a timezone
    defaults:
      run:
        shell: bash

    steps:
      # Runs before checkout: the bare container has no git (checkout needs it for a real clone).
      # The container runs as root, so no sudo. Build dependencies follow the Tauri v2 prerequisites
      # for Debian/Ubuntu; the app has no tray icon, so libayatana-appindicator3-dev is not needed.
      # The hosted runner image would have git, curl, pkg-config and xz preinstalled; the container
      # does not. `file` is used by the AppImage bundler, pkg-config by the gtk-rs build scripts.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget file xz-utils pkg-config build-essential \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1

      - name: Name the release files
        run: |
          version="$(node -p "require('./package.json').version")"
          name="MockupDirector-$version-linux-x86_64"
          bundle="src-tauri/target/release/bundle"
          mkdir -p dist-release
          cp "$bundle"/appimage/*.AppImage "dist-release/$name.AppImage"
          cp "$bundle"/deb/*.deb "dist-release/$name.deb"
          cp "$bundle"/rpm/*.rpm "dist-release/$name.rpm"
          ls -la dist-release

      # Double-clicking a .mdproj file opens the app only if the package installs the MIME definition
      # (src-tauri/linux/mockup-director-mime.xml) and its .desktop entry takes files (%F) of that type.
      - name: Check the .mdproj file association in the .deb
        run: |
          deb="$(ls dist-release/*.deb)"
          rm -rf deb-check && mkdir deb-check && dpkg-deb -x "$deb" deb-check
          if [ ! -f deb-check/usr/share/mime/packages/mockup-director.xml ]; then
            echo "::error::$deb does not install the MIME definition of .mdproj files"
            exit 1
          fi
          desktop="$(ls deb-check/usr/share/applications/*.desktop | head -n 1)"
          cat "$desktop"
          if ! grep -q '^Exec=.* %F$' "$desktop" || ! grep -q '^MimeType=application/x-mockup-director-project' "$desktop"; then
            echo "::error::$desktop does not open .mdproj files"
            exit 1
          fi

      # The licenses come with every copy (bundle.resources in tauri.conf.json); the AppImage and the
      # .rpm are made from the same files.
      - name: Check the .deb contains the licenses
        run: |
          for file in LICENSE.txt THIRD-PARTY-NOTICES.txt; do
            if [ -z "$(find deb-check/usr/lib -name "$file")" ]; then
              find deb-check -maxdepth 4
              echo "::error::The .deb does not contain $file"
              exit 1
            fi
          done

      # Each file on its own and unzipped, so the run's page offers the file itself. A download does
      # not keep the AppImage's executable bit, so the user runs `chmod +x` once (see README).
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*.AppImage
          archive: false
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*.deb
          archive: false
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*.rpm
          archive: false
          if-no-files-found: error
