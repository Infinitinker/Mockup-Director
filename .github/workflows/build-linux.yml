name: Build Linux app

# Builds the Linux release files: the AppImage, the .deb and the .rpm package, each kept on the run's
# page under its release file name, and checks them. The Release workflow (release.yml) calls it and
# drafts the release from them; run on its own, it shows early that a change still builds.
#
# It runs for every pull request (also Dependabot's and those from forks), from the Release workflow,
# and on demand (Actions > Build Linux app > Run workflow, on any branch); never for pushes.
# It is not a required status check; the Checks (checks.yml) and E2E tests (e2e.yml) are.
#
# Linux settings are in src-tauri/tauri.linux.conf.json. The AppImage is one file for any
# distribution and carries its own GTK and WebKitGTK libraries; the .deb (Debian, Ubuntu, Mint) and
# the .rpm (Fedora, openSUSE) use the system's WebKitGTK 4.1, which they declare as a dependency.
#
# The build runs in an ubuntu:22.04 container: a Linux binary runs only on systems with the same or
# a newer glibc than the one it was built with, so the container (glibc 2.35), not the runner, sets
# the oldest supported systems: Ubuntu 22.04+, Debian 12+, Fedora 36+ and similar. The hosted
# ubuntu-22.04 runner is deprecated (removed on 2027-04-17), hence the container on an ubuntu-24.04
# runner. Raise the container image only when dropping old distributions, and update the list in the
# README and docs/releasing.md.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request cancels the build still going; a release's build is never cut short.
# Called from release.yml, github.workflow is "Release".
concurrency:
  group: build-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

jobs:
  build:
    name: Linux build (x86_64)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 60
    outputs:
      # The three files, so the check downloads exactly these, whatever else the run builds.
      artifacts: ${{ steps.appimage.outputs.artifact-id }},${{ steps.deb.outputs.artifact-id }},${{ steps.rpm.outputs.artifact-id }}
    env:
      DEBIAN_FRONTEND: noninteractive # tzdata, which WebKitGTK pulls in, must not ask for a time zone
    defaults:
      run:
        shell: bash
    steps:
      # Before the checkout, which needs git for a real clone: the bare container has none. It runs as
      # root, so without sudo. The AppImage bundler uses `file`, the gtk-rs build scripts pkg-config.
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget file xz-utils pkg-config build-essential
      - uses: actions/checkout@v7
      # After the checkout, which brings the action.
      - name: Linux libraries
        uses: ./.github/actions/linux-libraries
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install
        run: npm ci
      - name: Build the app
        uses: tauri-apps/tauri-action@v1

      - name: Name the release files
        run: |
          version="$(node -p "require('./package.json').version")"
          name="MockupDirector-$version-linux-x86_64"
          bundle="src-tauri/target/release/bundle"
          mkdir -p dist-release
          cp "$bundle"/appimage/*.AppImage "dist-release/$name.AppImage"
          cp "$bundle"/deb/*.deb "dist-release/$name.deb"
          cp "$bundle"/rpm/*.rpm "dist-release/$name.rpm"
          ls -la dist-release
      # Double-clicking a .mdproj file opens the app only if the package installs the MIME definition
      # (src-tauri/linux/mockup-director-mime.xml) and its .desktop entry takes files (%F) of that type.
      - name: Check the file association
        run: |
          deb="$(ls dist-release/*.deb)"
          rm -rf deb-check && mkdir deb-check && dpkg-deb -x "$deb" deb-check
          if [ ! -f deb-check/usr/share/mime/packages/mockup-director.xml ]; then
            echo "::error::$deb does not install the MIME definition of .mdproj files"
            exit 1
          fi
          desktop="$(ls deb-check/usr/share/applications/*.desktop | head -n 1)"
          cat "$desktop"
          if ! grep -q '^Exec=.* %F$' "$desktop" || ! grep -q '^MimeType=application/x-mockup-director-project' "$desktop"; then
            echo "::error::$desktop does not open .mdproj files"
            exit 1
          fi
      # The licenses come with every copy (bundle.resources in tauri.conf.json); the AppImage and the
      # .rpm are made from the same files as the .deb.
      - name: Check the licenses
        run: |
          for file in LICENSE.txt THIRD-PARTY-NOTICES.txt; do
            if [ -z "$(find deb-check/usr/lib -name "$file")" ]; then
              find deb-check -maxdepth 4
              echo "::error::The .deb does not contain $file"
              exit 1
            fi
          done
      # Each file on its own and unzipped, so the run's page offers the files themselves. Each step
      # fails unless its pattern matches exactly one file. A download does not keep the AppImage's
      # executable bit, so users run `chmod +x` once (see the README).
      - id: appimage
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*.AppImage
          archive: false
          if-no-files-found: error
      - id: deb
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*.deb
          archive: false
          if-no-files-found: error
      - id: rpm
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*.rpm
          archive: false
          if-no-files-found: error

  files:
    name: Linux release files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # What the check runs, and the action.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            tools/release.mjs
            .github/actions/release-files
          sparse-checkout-cone-mode: false
      - name: Release files
        uses: ./.github/actions/release-files
        with:
          system: linux
          artifacts: ${{ needs.build.outputs.artifacts }}
