# Cheap checks on Linux for every push to main/dev and every pull request:
#   - web:      TypeScript type-check + Vite production build,
#   - licenses: no copyleft (GPL/AGPL/LGPL…) dependency in npm or Rust, plus generated
#               THIRD-PARTY-NOTICES.md (license texts of everything shipped in the app) as an artifact.
# The desktop apps are built by build-windows.yml and build-macos.yml.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Type-check & build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build (tsc --noEmit && vite build)
        run: npm run build

      - name: Validate Tauri JSON config
        run: |
          node -e "for (const f of ['src-tauri/tauri.conf.json','src-tauri/tauri.windows.conf.json','src-tauri/capabilities/default.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('OK', f); }"

  licenses:
    name: License check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Fails on any npm package (shipped or build-only) with a license outside the allow list.
      - name: Check npm licenses
        run: node scripts/licenses.mjs --notices THIRD-PARTY-NOTICES.md

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about

      # Fails on any Rust crate (for the Windows and macOS targets) with a license outside the
      # allow list in src-tauri/deny.toml.
      - name: Check Rust licenses (cargo-deny)
        run: cargo deny --manifest-path src-tauri/Cargo.toml check --config src-tauri/deny.toml licenses

      - name: Generate Rust license notices (cargo-about)
        run: |
          cargo about generate --manifest-path src-tauri/Cargo.toml --config src-tauri/about.toml \
            --output-file rust-notices.md src-tauri/about.hbs
          cat rust-notices.md >> THIRD-PARTY-NOTICES.md

      - name: Upload THIRD-PARTY-NOTICES.md
        uses: actions/upload-artifact@v6
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.md
          if-no-files-found: error
