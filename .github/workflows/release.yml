name: Release

# A pushed tag v<version> builds the release on all three systems and drafts its page, which a
# maintainer then completes and publishes (docs/releasing.md). A run started by hand (Actions →
# Release → Run workflow, on any branch) does the same without drafting, to try a release before
# tagging it; it keeps the files on the run's page for 90 days. Each system's build is a workflow of
# its own (build-windows.yml, build-macos.yml, build-linux.yml), which also checks its files, and
# which builds every pull request on its own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A release's build is never cut short.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The history of main, to check that the tag is on it.
      - name: Node.js
        uses: ./.github/actions/node
        with:
          cache: false
      # The version in package.json, of the form 1.2.3; one with a hyphen is a pre-release.
      - name: Read the version
        id: version
        run: node tools/release.mjs check
      # Fails before anything is built, rather than drafting a release under the wrong name or from
      # code that was never merged. A pre-release can be tagged on any branch.
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          node tools/release.mjs check "$GITHUB_REF_NAME"
          if [ "$PRERELEASE" = false ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge dev into main and tag the commit on main."
            exit 1
          fi

  windows:
    name: Windows app
    needs: version
    uses: ./.github/workflows/build-windows.yml

  macos:
    name: macOS app
    needs: version
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit # The optional Apple signing secrets (docs/releasing.md).

  linux:
    name: Linux app
    needs: version
    uses: ./.github/workflows/build-linux.yml

  # The committed notices, the same file every package contains, once they are checked.
  notices:
    name: Third-party notices
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node
      - name: Install
        run: npm ci
      - name: Licenses and notices
        uses: ./.github/actions/notices
      - name: Name the notices
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist-release
          cp THIRD-PARTY-NOTICES.md "dist-release/MockupDirector-$VERSION-third-party-notices.md"
      - uses: actions/upload-artifact@v7
        with:
          path: dist-release/*-third-party-notices.md
          archive: false
          if-no-files-found: error

  # No release is drafted while a dependency has an open security advisory.
  advisories:
    name: Advisories
    uses: ./.github/workflows/advisories.yml

  draft:
    name: Draft the release
    needs: [version, windows, macos, linux, notices, advisories]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # To create the release.
      id-token: write # To sign the provenance attestations.
      attestations: write # To store them.
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node
        with:
          cache: false
      # skip-decompress keeps each file as uploaded: otherwise the Windows ZIP would arrive unpacked.
      - uses: actions/download-artifact@v8
        with:
          pattern: MockupDirector-*
          merge-multiple: true
          skip-decompress: true
          path: release
      # Fails unless the folder holds exactly the release's files; the notes list their checksums.
      - name: Write the notes
        run: |
          ls -l release
          node tools/release.mjs notes release "$RUNNER_TEMP/notes.md"
      # Records that these files were built by this workflow from this commit, so anyone can check a
      # download with: gh attestation verify <file> --repo Infinitinker/Mockup-Director
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${flags[@]}" \
            --title "Mockup Director $VERSION" --notes-file "$RUNNER_TEMP/notes.md" -- release/*
