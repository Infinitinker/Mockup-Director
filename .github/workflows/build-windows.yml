# Builds the Mockup Director Windows app (x64): the NSIS installer and a portable ZIP, each kept on
# the run's page (Actions → run → Artifacts) under its release file name. The release workflow
# (release.yml) calls this workflow and puts the files on the release.
#
# Windows-specific bundle settings live in src-tauri/tauri.windows.conf.json (merged automatically
# by Tauri on Windows): NSIS installer only, per-user install (no admin rights needed).
# The app is not code-signed, so Windows SmartScreen shows "Windows protected your PC" on first
# run → "More info" → "Run anyway" (see README).
#
# It is built with MSYS2 (MINGW64) and Rust's GNU toolchain, not with Microsoft's C++ tools: the
# same toolchain as a developer's machine (docs/development.md). Tauri supports only MSVC
# officially, so this job also checks what a GNU build could get wrong. A GNU build loads
# WebView2Loader.dll at run time instead of linking it in: the installer must contain it, and the
# portable version is a ZIP with the DLL next to the executable. To go back to MSVC, replace the
# MSYS2 and Rust setup steps with `dtolnay/rust-toolchain@stable`, and package the portable .exe alone.
name: Build Windows app

# Runs on every push to dev and main (a merged pull request is a push to main), on demand, from the
# release workflow, and for pull requests, except those from this repository's dev and main, whose
# pushes are built already (so Dependabot's pull requests and other branches get a build).
# It is not a required status check: the Checks workflow (checks.yml) is.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push cancels the build still going for the older one; a release's build is never cut short.
# (Called from release.yml, github.workflow is "Release".)
concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

jobs:
  build-windows:
    # A fork can have a branch named dev too, so forks are always built. Called from release.yml,
    # it always builds, also for a pull request from dev.
    if: >-
      github.event_name != 'pull_request' || github.workflow == 'Release' ||
      github.event.pull_request.head.repo.fork || (github.head_ref != 'dev' && github.head_ref != 'main')
    name: Build (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # gcc links the app, windres compiles its icon and manifest. GITHUB_PATH puts MINGW64 first,
      # ahead of other MinGW copies on the runner (e.g. Strawberry Perl's).
      - name: Setup MSYS2 (MINGW64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Put MINGW64 on PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      # The GNU toolchain as the HOST toolchain, so build scripts are built with it too (a GNU
      # target on the runner's default MSVC toolchain would still use Microsoft's linker).
      - name: Setup Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
          which gcc windres

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1

      # A GNU build cannot start without WebView2Loader.dll; tauri-bundler puts it into the NSIS
      # installer (fixed for GNU builds in tauri-bundler 2.2.2). The licenses come with every copy
      # (bundle.resources in tauri.conf.json). 7-Zip can list NSIS installers.
      - name: Check the installer contains WebView2Loader.dll and the licenses
        run: |
          installer="$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)"
          7z l "$installer" > installer-contents.txt
          for file in WebView2Loader.dll LICENSE.txt THIRD-PARTY-NOTICES.txt; do
            if ! grep -qiF "$file" installer-contents.txt; then
              cat installer-contents.txt
              echo "::error::$installer does not contain $file"
              exit 1
            fi
          done

      # The release binary embeds the whole frontend, so it also runs without installing. It needs
      # the Microsoft Edge WebView2 runtime (part of Windows 10/11) and, as a GNU build, the
      # WebView2Loader.dll next to it, so the portable version is a ZIP of both.
      - name: Name the release files
        run: |
          version="$(node -p "require('./package.json').version")"
          name="MockupDirector-$version-windows-x64"
          release="src-tauri/target/release"
          folder="portable/Mockup Director"
          mkdir -p dist-release "$folder"
          cp "$release"/bundle/nsis/*-setup.exe "dist-release/$name-setup.exe"
          cp "$release/mockup-director.exe" "$folder/Mockup Director.exe"
          cp "$release/WebView2Loader.dll" "$folder/"
          cp LICENSE "$folder/LICENSE.txt"
          cp THIRD-PARTY-NOTICES.md "$folder/THIRD-PARTY-NOTICES.txt"
          printf '%s\r\n' \
            "Mockup Director $version, portable" \
            "" \
            "Start Mockup Director.exe. Nothing is installed: the app keeps its open tabs and looks in" \
            "%LOCALAPPDATA%\\io.github.infinitinker.mockupdirector, the same folder the installed app uses." \
            "" \
            "Update: replace this folder with the one from the new version." \
            "Remove: delete this folder. To remove your data too, also delete" \
            "%LOCALAPPDATA%\\io.github.infinitinker.mockupdirector (this also clears the installed app's data)." \
            "" \
            "Windows 10 or 11 (64-bit) with Microsoft Edge WebView2 is needed; it comes with Windows." \
            "The app is not signed: if SmartScreen stops it, click More info, then Run anyway." \
            "" \
            "Mockup Director is under the MIT license (LICENSE.txt). The licenses of the libraries" \
            "it contains are in THIRD-PARTY-NOTICES.txt." \
            "" \
            "Source and help: https://github.com/${{ github.repository }}" \
            "Built from commit $GITHUB_SHA." > "$folder/README.txt"
          (cd portable && 7z a -tzip "../dist-release/$name-portable.zip" "Mockup Director" > /dev/null)
          ls -la dist-release

      # Each file on its own and unzipped, so the run's page offers the file itself.
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*-windows-x64-setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*-windows-x64-portable.zip
          archive: false
          if-no-files-found: error
