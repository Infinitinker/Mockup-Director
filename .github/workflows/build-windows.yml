# Builds the Mockup Director Windows app (x64) and publishes
#   - workflow artifacts: the NSIS installer (.exe) and a portable ZIP (Actions → run → Artifacts),
#   - on tags v*: a DRAFT GitHub Release with the installer attached (the macOS and Linux workflows
#     attach their .dmg / .AppImage / .deb / .rpm to the same draft release).
#
# Windows-specific bundle settings live in src-tauri/tauri.windows.conf.json (merged automatically
# by Tauri on Windows): NSIS installer only, per-user install (no admin rights needed).
# The app is not code-signed, so Windows SmartScreen shows "Windows protected your PC" on first
# run → "More info" → "Run anyway" (see README).
#
# It is built with MSYS2 (MINGW64) and Rust's GNU toolchain, not with Microsoft's C++ tools: the
# same toolchain as a developer's machine (docs/development.md). Tauri supports only MSVC
# officially, so this job also checks what a GNU build could get wrong. A GNU build loads
# WebView2Loader.dll at run time instead of linking it in: the installer must contain it, and the
# portable version is a ZIP with the DLL next to the executable. To go back to MSVC, replace the
# MSYS2 and Rust setup steps with `dtolnay/rust-toolchain@stable`, and package the portable .exe alone.
name: Build Windows app

# Runs on every push to dev and main (a merged pull request is a push to main), on release tags
# and on demand. Its job name "Build (x86_64-pc-windows-gnu)" can be a required status check of
# the main branch ruleset: the push to dev runs it on the same commit the pull request merges.
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed to create the draft release on tags
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # gcc links the app, windres compiles its icon and manifest. GITHUB_PATH puts MINGW64 first,
      # ahead of other MinGW copies on the runner (e.g. Strawberry Perl's).
      - name: Setup MSYS2 (MINGW64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Put MINGW64 on PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      # The GNU toolchain as the HOST toolchain, so build scripts are built with it too (a GNU
      # target on the runner's default MSVC toolchain would still use Microsoft's linker).
      - name: Setup Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
          which gcc windres

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Release only for tags (empty inputs = build without uploading a release).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Mockup Director {0}', github.ref_name) || '' }}
          # Same text in all three build workflows: whichever finishes first creates the draft release.
          # tauri-action has no lock: if two builds finish within seconds of each other, it can create
          # two drafts for the same tag. Then move the assets into one draft and delete the other.
          # Quoted: a plain YAML scalar must not contain ": " (as in "Windows: ...").
          releaseBody: "${{ github.ref_type == 'tag' && 'Windows: download the *_x64-setup.exe file. macOS: download the .dmg file. Linux: download the .AppImage (any distribution), the .deb (Debian, Ubuntu) or the .rpm (Fedora, openSUSE). First launch: see the README.' || '' }}"
          releaseDraft: true
          prerelease: false

      # A GNU build cannot start without WebView2Loader.dll; tauri-bundler puts it into the NSIS
      # installer (fixed for GNU builds in tauri-bundler 2.2.2). 7-Zip can list NSIS installers.
      - name: Check the installer contains WebView2Loader.dll
        run: |
          installer="$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)"
          7z l "$installer" > installer-contents.txt
          if ! grep -qi 'WebView2Loader\.dll' installer-contents.txt; then
            cat installer-contents.txt
            echo "::error::$installer does not contain WebView2Loader.dll"
            exit 1
          fi

      # The release binary embeds the whole frontend, so it also runs without installing. It needs
      # the Microsoft Edge WebView2 runtime (part of Windows 10/11) and, as a GNU build, the
      # WebView2Loader.dll next to it, so the portable version is a ZIP of both.
      - name: Collect build outputs
        id: collect
        run: |
          version="${{ steps.tauri.outputs.appVersion }}"
          [ -n "$version" ] || version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          out="windows-dist"
          release="src-tauri/target/release"
          mkdir -p "$out/installer" "$out/portable/MockupDirector"
          cp "$release"/bundle/nsis/*-setup.exe "$out/installer/"
          cp "$release/mockup-director.exe" "$out/portable/MockupDirector/Mockup Director.exe"
          cp "$release/WebView2Loader.dll" "$out/portable/MockupDirector/"
          cp LICENSE "$out/portable/MockupDirector/LICENSE.txt"
          (cd "$out/portable" && 7z a -tzip "MockupDirector_${version}_x64_portable.zip" MockupDirector > /dev/null)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la "$out"/installer "$out"/portable

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: MockupDirector-${{ steps.collect.outputs.version }}-windows-setup
          path: windows-dist/installer/*.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: MockupDirector-${{ steps.collect.outputs.version }}-windows-portable
          path: windows-dist/portable/*.zip
          if-no-files-found: error
          compression-level: 0 # already a ZIP
