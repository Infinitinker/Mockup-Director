name: Build Windows app

# Builds the Windows release files: the installer and the ZIP, each kept on the run's
# page under its release file name, and checks them. The Release workflow (release.yml) calls it and
# drafts the release from them; run on its own, it shows early that a change still builds.
#
# It runs for every pull request (also Dependabot's and those from forks), from the Release workflow,
# and on demand (Actions > Build Windows app > Run workflow, on any branch); never for pushes.
# It is not a required status check; the Checks (checks.yml) and E2E tests (e2e.yml) are.
#
# Tauri builds the app without its own installers (bundle.active false in
# src-tauri/tauri.windows.conf.json); the installer is made with Inno Setup from tools/installer.iss
# (npm run installer). It installs for the user alone, with no administrator rights, or for all users
# if they choose. The app is not code-signed, so Windows SmartScreen warns on the first start (see the
# README).
#
# It is built with MSYS2 (MINGW64) and Rust's GNU toolchain, not with Microsoft's C++ tools: the
# toolchain of a developer's machine (.github/actions/windows-toolchain explains why). A GNU build
# loads WebView2Loader.dll at run time instead of linking it in: the installer installs it, and the
# ZIP has the DLL next to the executable.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request cancels the build still going; a release's build is never cut short.
# Called from release.yml, github.workflow is "Release".
concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

env:
  # Inno Setup's installer, checked against the SHA-256 that its release on GitHub lists.
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0

jobs:
  build:
    name: Windows build (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      # The two files, so the check downloads exactly these, whatever else the run builds.
      artifacts: ${{ steps.setup.outputs.artifact-id }},${{ steps.zip.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Node.js
        uses: ./.github/actions/node

      - name: Windows toolchain
        uses: ./.github/actions/windows-toolchain
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install
        run: npm ci
      # The app in src-tauri/target/release, with WebView2Loader.dll and the license texts
      # (bundle.resources in tauri.conf.json) next to it.
      - name: Build the app
        run: npm run tauri build

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $folder = Join-Path $env:RUNNER_TEMP "InnoSetup"
          Invoke-WebRequest $env:INNO_SETUP_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup's installer has the SHA-256 $hash, not $env:INNO_SETUP_SHA256." }
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$folder" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup's installer failed with exit code $($setup.ExitCode)." }
          "ISCC=$(Join-Path $folder 'ISCC.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      # Inno Setup stops on a file the app should have and does not, so the installer is complete.
      - name: Build the installer
        run: npm run installer

      # The release binary embeds the whole web UI, so it also runs without installing. It needs the
      # Microsoft Edge WebView2 runtime (part of Windows 10 and 11) and, as a GNU build,
      # WebView2Loader.dll next to it, so the ZIP holds both.
      - name: Name the release files
        run: |
          version="$(node -p "require('./package.json').version")"
          name="MockupDirector-$version-windows-x64"
          release="src-tauri/target/release"
          folder="zip/Mockup Director"
          mkdir -p dist-release "$folder"
          cp "$release/installer/$name-setup.exe" dist-release/
          cp "$release/mockup-director.exe" "$folder/"
          cp "$release/WebView2Loader.dll" "$folder/"
          cp LICENSE "$folder/LICENSE.txt"
          cp THIRD-PARTY-NOTICES.md "$folder/THIRD-PARTY-NOTICES.txt"
          printf '%s\r\n' \
            "Mockup Director $version" \
            "" \
            "Start mockup-director.exe. Nothing is installed: the app keeps its open tabs and looks in" \
            "%LOCALAPPDATA%\\Mockup Director, the same folder the installed app uses." \
            "" \
            "Update: replace this folder with the one from the new version." \
            "Remove: delete this folder. To remove your data too, also delete" \
            "%LOCALAPPDATA%\\Mockup Director (this also clears the installed app's data)." \
            "" \
            "Windows 10 or 11 (64-bit) with Microsoft Edge WebView2 is needed; it comes with Windows." \
            "The app is not signed: if SmartScreen stops it, click More info, then Run anyway." \
            "" \
            "Mockup Director is under the MIT license (LICENSE.txt). The licenses of the libraries" \
            "it contains are in THIRD-PARTY-NOTICES.txt." \
            "" \
            "Source and help: https://github.com/${{ github.repository }}" \
            "Built from commit $GITHUB_SHA." > "$folder/README.txt"
          (cd zip && 7z a -tzip "../dist-release/$name.zip" "Mockup Director" > /dev/null)
          ls -la dist-release
      # Each file on its own and unzipped, so the run's page offers the files themselves. Each step
      # fails unless its pattern matches exactly one file.
      - id: setup
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
      - id: zip
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/*-windows-x64.zip
          archive: false
          if-no-files-found: error

  files:
    name: Windows release files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # What the check runs, and the action.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            package.json
            tools/release.mjs
            .github/actions/release-files
            .github/actions/node
          sparse-checkout-cone-mode: false
      - name: Release files
        uses: ./.github/actions/release-files
        with:
          system: windows
          artifacts: ${{ needs.build.outputs.artifacts }}
