# Once a month, one pull request to dev with new versions of the actions the workflows use.
# npm packages and Rust crates are left out: their lockfiles pin them, and the Tauri packages on
# both sides (@tauri-apps/* and the tauri crates) must move together, tested in the app
# (docs/releasing.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Warsaw
    groups:
      actions:
        patterns: ["*"]
