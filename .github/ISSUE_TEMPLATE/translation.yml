name: Translation
description: Ask for the app in your language, offer to translate it, or report a wrong translation.
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "German"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What this is about
      options:
        - I would like the app in this language
        - I want to translate the app into this language
        - A translation is wrong or missing
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >
        For a wrong translation: where in the app, what it says, and what it should say. To translate,
        docs/translations.md explains how.
