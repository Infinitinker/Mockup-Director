[package]
name = "mockup-director"
# No version: the app's version is the one in package.json, which tauri.conf.json reads (for the
# app, its bundles and the Windows version resource). Cargo counts this crate as 0.0.0.
description = "Your artwork, as a real product. Photorealistic 3D mockups of boxes, disc cases, books, print and devices, made on your own computer."
authors = ["Infinitinker"]
license = "MIT"
repository = "https://github.com/Infinitinker/Mockup-Director"
edition = "2021"
rust-version = "1.90"
publish = false

# The library holds the actual app (`run()`); `main.rs` only calls it (the standard Tauri v2 layout).
# Only an rlib: the desktop apps link it into the executable. Tauri's mobile targets would also need
# "staticlib" and "cdylib", but as a Windows DLL built with the GNU toolchain (MSYS2) the cdylib
# exceeds the 65,535 exported symbols a DLL may have, and nothing uses it on the desktop.
[lib]
name = "mockup_director_lib"
crate-type = ["rlib"]
# Tests live in tests/ (mirroring src/). Windows needs the app manifest in every test executable
# (see build.rs), and Cargo can add it only to tests/ targets, not to unit tests inside src/.
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Test-only: the WebdriverIO plugins the end-to-end tests drive the app with (tests/e2e,
# docs/development.md). Built only by `npm run e2e:build`; release builds pass no features, so the
# plugins are never in them, and a build without debug assertions refuses the feature (lib.rs).
[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
# No extra tauri features are needed: no tray icon, no asset protocol, no private macOS APIs.
# (tauri-build verifies that these features match tauri.conf.json.)
# Pinned to the same MINOR as the npm packages (@tauri-apps/api 2.12.x, @tauri-apps/plugin-dialog
# 2.8.x): the Tauri CLI fails the build when the Rust crate and its npm counterpart differ in
# major.minor. Bump these together with package.json (see docs/releasing.md).
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system folders the log goes in (log.rs): the log starts before Tauri's path resolver exists.
# Tauri resolves its own folders with the same crate and version.
dirs = "7"
# The end-to-end test plugins (feature e2e): a WebDriver server inside the app, and the bridge that
# lets the tests mock commands. Exact versions: they must match @wdio/tauri-service in package.json.
tauri-plugin-wdio = { version = "=2.0.0-next.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=2.0.0-next.0", optional = true }

# The native message when the app cannot start or cannot open its window (the dialog plugin needs a
# running app): rfd on Windows and macOS, with the version and features tauri-plugin-dialog uses;
# on Linux GTK itself, which tao already started on the main thread (rfd would run GTK on a thread of
# its own). Neither adds crates.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# One app process on Windows and Linux: a second launch (double-clicking another project file) hands
# its files to the running app, which opens them in tabs. Rust only; it has no npm package. Not on
# macOS: there the system itself sends files to the running app (RunEvent::Opened), and the plugin
# would only add a socket in /tmp shared by all users.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
