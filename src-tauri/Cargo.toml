[package]
name = "mockup-director"
version = "0.1.0"
description = "Mockup Director – photorealistic 3D mockups of packaging, books, print and devices"
authors = ["Infinitinker"]
license = "MIT"
repository = "https://github.com/Infinitinker/Mockup-Director"
edition = "2021"
rust-version = "1.77.2"
publish = false

# The library holds the actual app (`run()`); `main.rs` only calls it (the standard Tauri v2 layout).
# Only an rlib: the desktop apps link it into the executable. Tauri's mobile targets would also need
# "staticlib" and "cdylib", but as a Windows DLL built with the GNU toolchain (MSYS2) the cdylib
# exceeds the 65,535 exported symbols a DLL may have, and nothing uses it on the desktop.
[lib]
name = "mockup_director_lib"
crate-type = ["rlib"]
# Tests live in tests/ (mirroring src/). Windows needs the app manifest in every test executable
# (see build.rs), and Cargo can add it only to tests/ targets, not to unit tests inside src/.
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No extra tauri features are needed: no tray icon, no asset protocol, no private macOS APIs.
# (tauri-build verifies that these features match tauri.conf.json.)
# Pinned to the same MINOR as the npm packages (@tauri-apps/api 2.12.x, @tauri-apps/plugin-dialog
# 2.8.x): the Tauri CLI fails the build when the Rust crate and its npm counterpart differ in
# major.minor. Bump these together with package.json (see docs/releasing.md).
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
