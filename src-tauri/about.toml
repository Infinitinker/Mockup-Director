# cargo-about configuration: the Rust part of THIRD-PARTY-NOTICES.md, which tools/notices.mjs
# writes with it (npm run notices).
# Keep `accepted` in sync with src-tauri/deny.toml.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "MPL-2.0",
]
# Keep in sync with `targets` in src-tauri/deny.toml.
targets = [
  "x86_64-pc-windows-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
