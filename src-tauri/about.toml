# cargo-about configuration – generates the Rust part of THIRD-PARTY-NOTICES.md in CI.
#   cargo about generate --manifest-path src-tauri/Cargo.toml --config src-tauri/about.toml src-tauri/about.hbs
# Keep `accepted` in sync with src-tauri/deny.toml.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "MPL-2.0",
]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
