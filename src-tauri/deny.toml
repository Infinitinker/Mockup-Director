# cargo-deny configuration – used in CI to make sure no Rust dependency brings a copyleft license
# (GPL, AGPL, LGPL, …) into the app (.github/workflows/checks.yml, job "Licenses"), and that none has
# a security advisory (.github/workflows/advisories.yml).
#   cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml check licenses
#   cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml check advisories

[graph]
# Only the platforms we ship (keep in sync with `targets` in src-tauri/about.toml). The Linux target
# pulls in the GTK / WebKitGTK binding crates (gtk-rs, webkit2gtk-rs); the C libraries themselves
# come from the system (or the AppImage) and are not Rust dependencies.
targets = [
  "x86_64-pc-windows-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# The test-only crates of the end-to-end tests (Cargo feature e2e) are license-checked too, although
# they never ship. cargo-about (src-tauri/about.toml) runs without the feature, so the notices list
# only what the app contains.
features = ["e2e"]

[licenses]
# Permissive licenses, plus MPL-2.0 (weak, file-level copyleft that never extends to our code).
# Keep in sync with ALLOWED in tools/licenses.mjs and `accepted` in src-tauri/about.toml.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory – not every license must actually occur.
unused-allowed-license = "allow"

[licenses.private]
# Our own crate (publish = false) is MIT anyway, but there is no need to check it.
ignore = true

[advisories]
# Fails on every vulnerability in the RustSec database and on a yanked crate in Cargo.lock. An
# unmaintained or unsound crate fails only when the app depends on it directly: the ones deep in
# Tauri's dependencies (the gtk-rs 0.18 crates on Linux, zbus through tauri-plugin-single-instance)
# move only with Tauri. To accept an advisory that does not affect the app, add its id with the
# reason: ignore = [{ id = "RUSTSEC-…", reason = "…" }].
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
