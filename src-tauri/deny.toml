# cargo-deny configuration – used in CI (.github/workflows/ci.yml, job "licenses") to make sure no
# Rust dependency brings a copyleft license (GPL, AGPL, LGPL, …) into the app.
#   cargo deny --manifest-path src-tauri/Cargo.toml check --config src-tauri/deny.toml licenses

[graph]
# Only the platforms we ship. Linux-only crates (GTK/WebKitGTK bindings) are not part of our builds.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[licenses]
# Permissive licenses, plus MPL-2.0 (weak, file-level copyleft that never extends to our code).
# Keep in sync with ALLOWED in scripts/licenses.mjs and `accepted` in src-tauri/about.toml.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory – not every license must actually occur.
unused-allowed-license = "allow"

[licenses.private]
# Our own crate (publish = false) is MIT anyway, but there is no need to check it.
ignore = true
